<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasdag</title>
<meta name="description" content="Een spelletje om te leren hoe je de was sorteert, de wasmachine instelt en wassymbolen leest.">
<meta name="theme-color" content="#cfe8ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e6f3ff; --bg2:#fdeef6; --card:#fff; --ink:#1f2a44; --muted:#66708a; --line:#dbe4f3;
  --blue:#4f9ef0; --blue-d:#2f7fd6; --pink:#f06aa8; --green:#1fb35a; --green-l:#dcfce7;
  --red:#e5484d; --red-l:#ffe4e6; --yellow:#fbbf24;
  --shadow:0 4px 0 rgba(31,42,68,.07), 0 10px 28px rgba(31,42,68,.08);
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Nunito,system-ui,-apple-system,sans-serif; color:var(--ink);
  background:linear-gradient(165deg,var(--bg1) 0%,#f3f0ff 50%,var(--bg2) 100%) fixed;
  background-color:var(--bg1);
  min-height:100vh; min-height:100dvh; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif;font-weight:600;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom));position:relative;z-index:1}

/* bubbles */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles i{position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25) 45%,rgba(160,200,255,.18) 70%);
  border:1px solid rgba(255,255,255,.7);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}

/* topbar */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;flex:none}
.top .mid{flex:1;font-weight:800;color:var(--muted);font-size:15px}
.pill{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.2)}}
.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:999px;transition:width .4s}

/* home */
.hero{text-align:center;padding:18px 0 6px}
.hero .logo{font-size:64px;line-height:1;display:inline-block;animation:wobble 3s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.hero h1{font-size:44px;margin:8px 0 2px;background:linear-gradient(90deg,var(--blue-d),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-weight:700}
.modes{display:grid;gap:12px;margin-top:22px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s}
.mode:active{transform:scale(.98)}
.mode .mi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none}
.mode h3{margin:0;font-size:20px}
.mode p{margin:2px 0 0;color:var(--muted);font-size:14px;font-weight:700}
.mode .best{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);text-align:center;flex:none}
.mode .best b{display:block;font-size:16px;color:var(--ink)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;font-weight:700}

/* sort */
.q{text-align:center;margin:0 0 10px;font-size:24px}
.stage{display:flex;justify-content:center;min-height:262px}
.item{width:min(250px,72vw);background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:14px 14px 12px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;z-index:5;animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
.item.drag{cursor:grabbing;box-shadow:0 18px 40px rgba(31,42,68,.22);transition:none}
.item.back{transition:transform .3s cubic-bezier(.3,1.4,.6,1)}
.item.fly{transition:transform .45s cubic-bezier(.5,0,.7,.4),opacity .45s}
.item.shake{animation:shake .45s}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.cloth{width:132px;height:132px;display:block;margin:0 auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.08))}
.iname{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:4px 0 8px}
.tag{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;background:#fafbff;border:2px dashed #c8d2e6;border-radius:10px;padding:5px 6px}
.tag .sym{width:32px;height:32px;cursor:help}
.sym{color:var(--ink);display:block}
.hint{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin:10px 0 12px}
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.basket{background:var(--card);border-radius:18px;padding:10px 6px 9px;box-shadow:var(--shadow);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,border-color .15s,background .15s;min-height:96px;position:relative;overflow:hidden}
.basket::before{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:var(--bc);opacity:.55;border-radius:0 0 14px 14px}
.basket>*{position:relative}
.basket .be{font-size:28px;line-height:1.1}
.basket .bn{font-weight:800;font-size:13.5px;line-height:1.15;text-align:center}
.basket .bs{font-size:11.5px;color:var(--muted);font-weight:800}
.basket.hot{transform:scale(1.07);border-color:var(--blue)}
.basket.good{border-color:var(--green);background:var(--green-l)}
.basket.bad{border-color:var(--red);background:var(--red-l)}
.basket.gulp{animation:bump .4s}
@media (max-width:360px){.baskets{grid-template-columns:repeat(2,1fr)}}
.floatpts{position:fixed;font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;color:var(--green);pointer-events:none;z-index:50;animation:floatup 1s forwards}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.3,1.3,.6,1)}
@keyframes up{from{transform:translateY(110%)}}
.sheet .in{width:100%;max-width:540px;background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 -6px 40px rgba(31,42,68,.2);border-top:6px solid var(--green)}
.sheet.no .in{border-top-color:var(--red)}
.sheet h3{margin:0 0 6px;font-size:22px}
.sheet p{margin:0 0 14px;line-height:1.45;font-weight:600}
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;background:linear-gradient(180deg,#5eaaf5,var(--blue-d));color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 #1f63ad;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f63ad}
.btn.pink{background:linear-gradient(180deg,#f78bbd,#e0558f);box-shadow:0 4px 0 #b83a70}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;pointer-events:none}
.btns{display:grid;gap:10px;margin-top:16px}

/* machine mode */
.loadhead{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.loadhead h2{margin:0 0 6px;font-size:21px}
.loaditems{display:flex;flex-wrap:wrap;gap:6px}
.mini{display:flex;align-items:center;gap:4px;background:#f5f7fc;border-radius:10px;padding:3px 8px 3px 3px;font-size:12.5px;font-weight:800}
.mini .cloth{width:30px;height:30px;margin:0;filter:none}
.machine{width:96px;height:118px;flex:none;background:linear-gradient(180deg,#fff,#eef2f8);border-radius:14px;border:3px solid #cfd8e8;position:relative}
.machine .panel{height:22px;border-bottom:3px solid #cfd8e8;display:flex;align-items:center;gap:5px;padding:0 8px}
.machine .panel i{width:9px;height:9px;border-radius:50%;background:#cfd8e8}
.machine .panel i.led{background:#9be7a6;margin-left:auto;width:22px;border-radius:4px}
.machine.spinning .panel i.led{background:#22c55e;animation:blink .4s infinite}
@keyframes blink{50%{opacity:.3}}
.door{position:absolute;left:50%;top:32px;width:70px;height:70px;margin-left:-35px;border-radius:50%;border:5px solid #b9c4d8;background:#dff0ff;overflow:hidden}
.drum{position:absolute;inset:0}
.drum b{position:absolute;width:22px;height:16px;border-radius:7px}
.water{position:absolute;left:-20%;right:-20%;bottom:0;height:42%;background:rgba(79,158,240,.35);border-radius:40% 40% 0 0}
.machine.spinning .drum{animation:spin .5s linear infinite}
.machine.spinning .water{animation:slosh .6s ease-in-out infinite alternate}
.machine.spinning{animation:rattle .12s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slosh{to{transform:rotate(8deg) translateY(-4px)}}
@keyframes rattle{50%{transform:translate(1px,-1px)}}
.rows{display:grid;gap:10px}
.row{background:var(--card);border-radius:18px;padding:11px 12px;box-shadow:var(--shadow);border:3px solid transparent}
.row .rl{font-weight:800;font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:56px;padding:9px 8px;border-radius:12px;background:#f1f4fa;font-weight:800;font-size:14px;border:2px solid transparent;transition:background .15s}
.seg button.on{background:#dbeafe;border-color:var(--blue);color:#174a8a}
.row.ok{border-color:var(--green)}
.row.no{border-color:var(--red)}
.row.ok .seg button.on{background:var(--green-l);border-color:var(--green);color:#11632f}
.row.no .seg button.on{background:var(--red-l);border-color:var(--red);color:#9b1c22}
.row .seg button.right{border-style:dashed;border-color:var(--green)}
.why{font-size:13.5px;line-height:1.4;font-weight:600;margin-top:8px;display:none}
.row.ok .why,.row.no .why{display:block}
.locked .seg button{pointer-events:none}

/* symbols mode */
.symcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;display:grid;place-items:center;margin:0 auto 16px;width:180px;height:180px;animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
.symcard .sym{width:120px;height:120px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:14px 16px;text-align:left;font-weight:800;border:3px solid transparent;font-size:15.5px}
.opt.good{border-color:var(--green);background:var(--green-l)}
.opt.bad{border-color:var(--red);background:var(--red-l)}
.explain{margin-top:14px;background:#fffbea;border-radius:16px;padding:12px 14px;font-weight:700;line-height:1.45;font-size:14.5px;border:2px solid #fde68a}

/* results */
.res{text-align:center;background:var(--card);border-radius:28px;padding:24px 18px;box-shadow:var(--shadow);margin-top:10px}
.stars{font-size:46px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.25}
.res h2{margin:6px 0 2px;font-size:30px}
.res .big{font-family:Fredoka,sans-serif;font-size:52px;font-weight:700;color:var(--blue-d);line-height:1.1}
.res .rank{display:inline-block;margin-top:6px;background:#fdf2f8;color:#a3215f;border-radius:999px;padding:6px 14px;font-weight:800}
.newbest{color:var(--pink);font-weight:800;margin-top:8px}
.review{margin-top:18px;text-align:left}
.review h3{font-size:18px;margin:0 0 8px}
.rv{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow);margin-bottom:8px;font-size:14px;line-height:1.4;font-weight:600}
.rv .cloth,.rv .sym{width:48px;height:48px;flex:none;margin:0}
.rv b{font-weight:800}

/* cheat sheet */
.sec{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.sec h2{margin:0 0 10px;font-size:22px}
.bk{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.bk:first-of-type{border-top:0}
.bk .be{font-size:26px;width:34px;text-align:center;flex:none}
.bk p{margin:2px 0 0;font-size:14px;line-height:1.4;font-weight:600;color:#3a4560}
.rules{margin:0;padding-left:20px;line-height:1.5;font-weight:600}
.rules li{margin:4px 0}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.symgrid div{display:flex;gap:8px;align-items:center;background:#f7f9fd;border-radius:12px;padding:6px;font-size:12.5px;font-weight:700;line-height:1.25}
.symgrid .sym{width:40px;height:40px;flex:none}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center;animation:fadein .2s;font-size:14.5px}
@keyframes fadein{from{opacity:0;transform:translate(-50%,-8px)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<main id="app"></main>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = {
  get() { try { return JSON.parse(localStorage.getItem('wasdag') || '{}'); } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem('wasdag', JSON.stringify(o)); } catch (e) {} }
};
function saveBest(mode, pct) {
  const s = store.get();
  if (s[mode] === undefined || pct > s[mode]) { s[mode] = pct; store.set(s); return true; }
  return false;
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} };

/* ---------- wassymbolen ---------- */
const SYM = {
  w30: 'Wassen op max. 30°C',
  w40: 'Wassen op max. 40°C',
  w60: 'Wassen op max. 60°C',
  w95: 'Kookwas: max. 95°C',
  w30b1: 'Max. 30°C, mild programma (synthetisch)',
  w30b2: 'Max. 30°C, extra mild (wol / fijne was)',
  hand: 'Alleen met de hand wassen',
  wno: 'Niet wassen met water',
  bleach: 'Bleken mag',
  nbleach: 'Niet bleken',
  d1: 'Droogkast op lage temperatuur',
  d2: 'Droogkast op normale temperatuur',
  dno: 'Niet in de droogkast',
  dflat: 'Plat laten drogen',
  dline: 'Aan de lijn / op het rek drogen',
  i1: 'Strijken op lage temperatuur (max. 110°C)',
  i2: 'Strijken op middelhoge temperatuur (max. 150°C)',
  i3: 'Strijken op hoge temperatuur (max. 200°C)',
  ino: 'Niet strijken',
  P: 'Professioneel reinigen (stomerij / droogkuis)',
  cno: 'Niet chemisch reinigen (niet naar de stomerij)'
};
const SYMTIP = {
  w30: 'Het getal in de tobbe is de maximale temperatuur.',
  w40: 'Het getal in de tobbe is de maximale temperatuur.',
  w60: 'Typisch voor witte katoen, handdoeken en beddengoed.',
  w95: 'Bijna nooit nodig: 60°C is voor bijna alles warm genoeg.',
  w30b1: 'Streepjes onder de tobbe = voorzichtiger wassen. 1 streep = mild programma.',
  w30b2: '2 strepen onder de tobbe = extra voorzichtig: wol- of fijnwasprogramma met lage centrifuge.',
  hand: 'Een hand in de tobbe = handwas (of het handwasprogramma van de machine).',
  wno: 'Een kruis door de tobbe: niet in de machine én niet met de hand.',
  bleach: 'Een lege driehoek = bleekmiddel mag.',
  nbleach: 'Een doorgekruiste driehoek = geen bleekmiddel (ook geen wit-wasmiddel met bleek).',
  d1: 'Een vierkant met een cirkel = droogkast. 1 puntje = lage stand.',
  d2: 'Een vierkant met een cirkel = droogkast. 2 puntjes = normale stand.',
  dno: 'Doorgekruiste droogkast: dit krimpt of gaat kapot in de droogkast!',
  dflat: 'Een streep in het vierkant = plat neerleggen, typisch voor wol.',
  dline: 'Een boogje bovenaan het vierkant = aan de waslijn.',
  i1: 'Het strijkijzer: hoe meer puntjes, hoe heter. 1 puntje = laag (zijde, synthetisch).',
  i2: '2 puntjes = middelhoog (wol, polyester-mix).',
  i3: '3 puntjes = heet (katoen, linnen).',
  ino: 'Doorgekruist strijkijzer: niet strijken.',
  P: 'Een cirkel = professionele reiniging. Breng het naar de stomerij/droogkuis.',
  cno: 'Doorgekruiste cirkel: niet chemisch laten reinigen.'
};
function sym(code) {
  const num = t => `<text x="32" y="43" text-anchor="middle" font-size="17" font-weight="800" fill="currentColor" stroke="none" font-family="Nunito,sans-serif">${t}</text>`;
  const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="3.2" fill="currentColor" stroke="none"/>`;
  const tub = '<path d="M5 17 L12 50 H52 L59 17"/><path d="M5 17 Q11.75 11 18.5 17 T32 17 T45.5 17 T59 17"/>';
  const cross = '<path d="M7 7 L57 57 M57 7 L7 57"/>';
  const sq = '<rect x="8" y="8" width="48" height="48" rx="2"/>';
  const tri = '<path d="M32 8 L58 54 H6 Z"/>';
  const iron = '<path d="M6 50 H56 V36 Q56 22 42 22 H22 Q12 26 6 50 Z"/><path d="M24 22 L26 13 H48"/>';
  const ring = '<circle cx="32" cy="32" r="24"/>';
  const hand = '<g stroke-width="2.6"><path d="M25 44 V31 M30 44 V27 M35 44 V28 M40 44 V32"/><path d="M22 36 Q19 46 27 47 H39 Q43 47 43 41"/></g>';
  const parts = {
    w30: tub + num(30), w40: tub + num(40), w60: tub + num(60), w95: tub + num(95),
    w30b1: tub + num(30) + '<path d="M10 57 H54"/>',
    w30b2: tub + num(30) + '<path d="M10 56 H54"/><path d="M10 62 H54"/>',
    hand: tub + hand, wno: tub + cross,
    bleach: tri, nbleach: tri + cross,
    d1: sq + '<circle cx="32" cy="32" r="17"/>' + dot(32, 32),
    d2: sq + '<circle cx="32" cy="32" r="17"/>' + dot(26, 32) + dot(38, 32),
    dno: sq + '<circle cx="32" cy="32" r="17"/>' + cross,
    dflat: sq + '<path d="M18 32 H46"/>',
    dline: sq + '<path d="M8 17 Q32 36 56 17"/>',
    i1: iron + dot(33, 40), i2: iron + dot(27, 40) + dot(39, 40), i3: iron + dot(22, 40) + dot(33, 40) + dot(44, 40),
    ino: iron + cross,
    P: ring + '<text x="32" y="40.5" text-anchor="middle" font-size="24" font-weight="800" fill="currentColor" stroke="none" font-family="Nunito,sans-serif">P</text>',
    cno: ring + cross
  };
  return `<svg class="sym" data-c="${code}" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${SYM[code]}"><title>${SYM[code]}</title>${parts[code]}</svg>`;
}

/* ---------- kleding ---------- */
const SH = {
  top: 'M30 14 L42 9 Q50 17 58 9 L70 14 L91 32 L79 45 L70 38 L70 91 L30 91 L30 38 L21 45 L9 32 Z',
  long: 'M30 14 L42 9 Q50 17 58 9 L70 14 L84 30 L94 80 L82 82 L71 46 L71 91 L29 91 L29 46 L18 82 L6 80 L16 30 Z'
};
const SHAPES = {
  tshirt: SH.top, sweater: SH.long, shirt: SH.long, jacket: SH.long, blazer: SH.long,
  trousers: 'M27 9 L73 9 L81 93 L59 93 L50 38 L41 93 L19 93 Z',
  leggings: 'M33 9 L67 9 L69 93 L56 93 L50 40 L44 93 L31 93 Z',
  shorts: 'M24 24 L76 24 L82 72 L57 75 L50 50 L43 75 L18 72 Z',

    card.classList.remove('back'); card.classList.add('fly');
    const ox = +card.dataset.dx || 0, oy = +card.dataset.dy || 0;
    card.style.transform = `translate(${br.left + br.width / 2 - (cr.left + cr.width / 2) + ox}px,${br.top + br.height / 2 - (cr.top + cr.height / 2) + oy}px) scale(.15) rotate(20deg)`;
    card.style.opacity = '0';
    setTimeout(() => chosen.classList.add('gulp'), 380);
    const f = document.createElement('div'); f.className = 'floatpts'; f.textContent = '+' + pts;
    f.style.left = br.left + br.width / 2 - 20 + 'px'; f.style.top = br.top - 10 + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
    setScore(S.score);
    title = pick(PRAISE) + (S.streak >= 3 ? ` 🔥 ${S.streak} op een rij (+5)` : '');
  } else {
    S.streak = 0; S.wrong.push({ it, k }); buzz();
    card.classList.remove('back'); card.style.transform = ''; card.classList.add('shake');
    title = `Oeps! Dit hoort bij: ${it.b.map(b => BASKETS[b].n).join(' of ')}`;
  }
  sheet(ok, title, it.tip, S.i + 1 < S.items.length ? 'Volgende →' : 'Bekijk je score 🏁', () => {
    S.i++;
    if (S.i < S.items.length) renderSort();
    else results({ mode: 'sort', good: S.good, total: S.items.length, score: S.score, review: S.wrong.map(w => `<div class="rv">${clothSVG(w.it)}<div><b>${w.it.n}</b> → ${w.it.b.map(b => BASKETS[b].e + ' ' + BASKETS[b].n).join(' of ')}<br>${w.it.tip}</div></div>`) });
  });
}

/* ---------- 2. wasmachine ---------- */
function startMachine() {
  S = { mode: 'machine', rounds: shuffle(Object.keys(PROGRAMS)), i: 0, score: 0, good: 0, total: 0, wrong: [] };
  renderMachine();
}
function renderMachine() {
  const key = S.rounds[S.i]; const B = BASKETS[key];
  const load = shuffle(ITEMS.filter(it => it.b[0] === key)).slice(0, 3);
  S.picks = {}; S.load = load;
  const blobs = LOADCOL[key].map((c, j) => `<b style="background:${c};border:2px solid ${outline(c)};left:${[10, 36, 22][j]}px;top:${[14, 24, 36][j]}px"></b>`).join('');
  app.innerHTML = `
    ${topbar(`Wasbeurt ${S.i + 1} van ${S.rounds.length}`, S.score)}
    <div class="progress"><span style="width:${S.i / S.rounds.length * 100}%"></span></div>
    <div class="loadhead">
      <div class="machine" id="machine"><div class="panel"><i></i><i></i><i class="led"></i></div><div class="door"><div class="drum">${blobs}</div><div class="water"></div></div></div>
      <div><h2>${B.e} ${B.n}</h2><div class="loaditems">${load.map(it => `<span class="mini">${clothSVG(it)}${it.n}</span>`).join('')}</div></div>
    </div>
    <div class="rows" id="rows">${SETTINGS.map(s => `<div class="row" data-k="${s.k}"><div class="rl">${s.i} ${s.n}</div><div class="seg">${s.o.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('')}</div><div class="why"></div></div>`).join('')}</div>
    <div class="btns"><button class="btn pink" id="go" disabled>Start de was ▶</button></div>`;
  bindHome();
  $$('.row').forEach(row => row.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', row).forEach(x => x.classList.toggle('on', x === b));
    S.picks[row.dataset.k] = b.dataset.v;
    $('#go').disabled = Object.keys(S.picks).length < SETTINGS.length;
  }));
  $('#go').onclick = runMachine;
  scrollTo(0, 0);
}
function runMachine() {
  const key = S.rounds[S.i]; const P = PROGRAMS[key];
  $('#rows').classList.add('locked'); const go = $('#go'); go.disabled = true; go.textContent = 'Aan het wassen… 🫧';
  $('#machine').classList.add('spinning');
  scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => {
    $('#machine').classList.remove('spinning');
    let good = 0;
    SETTINGS.forEach(s => {
      const row = $(`.row[data-k="${s.k}"]`); const v = S.picks[s.k]; const ok = P.ok[s.k].includes(v);
      if (ok) good++;
      else {
        S.wrong.push(`<div class="rv"><div style="font-size:30px">${s.i}</div><div><b>${BASKETS[key].n} – ${s.n}</b><br>${P.why[s.k]}</div></div>`);
        $$('button', row).forEach(b => { if (P.ok[s.k].includes(b.dataset.v)) b.classList.add('right'); });
      }
      row.classList.add(ok ? 'ok' : 'no');
      const labels = P.ok[s.k].map(v => s.o.find(o => o[0] === v)[1]);
      $('.why', row).innerHTML = (ok ? '✅ ' : `❌ Beter: <b>${labels.join(' of ')}</b>. `) + P.why[s.k];
    });
    S.good += good; S.total += SETTINGS.length; S.score += good * 5 + (good === SETTINGS.length ? 10 : 0);
    setScore(S.score);
    if (good === SETTINGS.length) { toast('Perfecte wasbeurt! +10 bonus ✨'); confetti(); }
    else if (good < SETTINGS.length) buzz();
    const last = S.i + 1 >= S.rounds.length;
    go.textContent = last ? 'Bekijk je score 🏁' : 'Volgende wasbeurt →'; go.disabled = false;
    go.onclick = () => { S.i++; if (!last) renderMachine(); else results({ mode: 'machine', good: S.good, total: S.total, score: S.score, review: S.wrong }); };
    const first = $('.row.no'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 1700);
}

/* ---------- 3. symbolen ---------- */
const symGroup = c => (c[0] === 'w' || c === 'hand') ? 'wash' : c.includes('bleach') ? 'bleach' : c[0] === 'd' ? 'dry' : c[0] === 'i' ? 'iron' : 'clean';
function startSym() {
  S = { mode: 'sym', qs: shuffle(Object.keys(SYM)).slice(0, 12), i: 0, score: 0, good: 0, wrong: [] };
  renderSym();
}
function renderSym() {
  const c = S.qs[S.i];
  const same = shuffle(Object.keys(SYM).filter(x => x !== c && symGroup(x) === symGroup(c))).slice(0, 2);
  const rest = shuffle(Object.keys(SYM).filter(x => x !== c && !same.includes(x))).slice(0, 3 - same.length);
  const opts = shuffle([c, ...same, ...rest]);
  app.innerHTML = `
    ${topbar(`Symbool ${S.i + 1} van ${S.qs.length}`, S.score)}
    <div class="progress"><span style="width:${S.i / S.qs.length * 100}%"></span></div>
    <h2 class="q">Wat betekent dit symbool?</h2>
    <div class="symcard">${sym(c).replace('<title>' + SYM[c] + '</title>', '').replace(/aria-label="[^"]*"/, 'aria-label="Wassymbool"')}</div>
    <div class="opts">${opts.map(o => `<button class="opt" data-o="${o}">${SYM[o]}</button>`).join('')}</div>
    <div id="fb"></div>`;
  bindHome();
  $$('.opt').forEach(b => b.onclick = () => {
    if (S.locked) return; S.locked = true;
    const ok = b.dataset.o === c;
    $$('.opt').forEach(x => { if (x.dataset.o === c) x.classList.add('good'); else if (x === b) x.classList.add('bad'); });
    if (ok) { S.good++; S.score += 10; setScore(S.score); } else { buzz(); S.wrong.push(`<div class="rv">${sym(c)}<div><b>${SYM[c]}</b><br>${SYMTIP[c]}</div></div>`); }
    const last = S.i + 1 >= S.qs.length;
    $('#fb').innerHTML = `<div class="explain">${ok ? pick(PRAISE) : 'Niet helemaal…'} 💡 ${SYMTIP[c]}</div><div class="btns"><button class="btn" id="next">${last ? 'Bekijk je score 🏁' : 'Volgende →'}</button></div>`;
    $('#next').onclick = () => { S.locked = false; S.i++; if (!last) { renderSym(); scrollTo(0, 0); } else results({ mode: 'sym', good: S.good, total: S.qs.length, score: S.score, review: S.wrong }); };
    $('#next').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

/* ---------- resultaten ---------- */
function results({ mode, good, total, score, review }) {
  $('.sheet')?.remove();
  const pct = Math.round(good / total * 100);
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  const rank = pct === 100 ? 'Wasmeester 👑' : pct >= 90 ? 'Wasexpert 🧺' : pct >= 70 ? 'Wasleerling 🫧' : pct >= 40 ? 'Wasbeginner 🧦' : 'Wasrampje 😅';
  const msg = pct === 100 ? 'Foutloos! Jij mag voortaan de was doen 😉' : pct >= 70 ? 'Heel goed bezig!' : 'Oefening baart kunst, probeer nog eens!';
  const isBest = saveBest(mode, pct);
  app.innerHTML = `
    ${topbar('Resultaat')}
    <div class="res">
      <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">⭐</span>`).join('')}</div>
      <h2>${msg}</h2>
      <div class="big">${pct}%</div>
      <div style="color:var(--muted);font-weight:800">${good} van ${total} juist · ${score} punten</div>
      <div class="rank">${rank}</div>
      ${isBest && pct > 0 ? '<div class="newbest">Nieuw record! 🎉</div>' : ''}
      <div class="btns"><button class="btn pink" id="again">Nog een keer</button><button class="btn ghost" data-home>Naar het menu</button></div>
    </div>
    ${review.length ? `<div class="review"><h3>Om te onthouden 💡</h3>${review.join('')}</div>` : ''}`;
  bindHome();
  $('#again').onclick = { sort: startSort, machine: startMachine, sym: startSym }[mode];
  if (stars >= 2) confetti();
  scrollTo(0, 0);
}

/* ---------- start ---------- */
(function bubbles() {
  const wrap = $('#bubbles');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('i'); const s = 14 + Math.random() * 46;
    b.style.width = b.style.height = s + 'px'; b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = 12 + Math.random() * 16 + 's'; b.style.animationDelay = -Math.random() * 25 + 's';
    wrap.appendChild(b);
  }
})();
home();
</script>
